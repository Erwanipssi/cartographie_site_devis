# Développement : `docker compose up -d postgres redis` (ou `corepack pnpm start`).
# Déploiement : `docker compose --profile full up -d --build`, interface sur le port 8080.
#
# Sécurité :
# - PostgreSQL et Redis ne sont publiés que sur 127.0.0.1 : jamais joignables depuis le réseau.
#   (Redis n'a pas de mot de passe ; ouvert au réseau, n'importe qui pourrait vider les files.)
# - L'API n'est pas publiée : seul nginx (port 8080) est exposé, et il exige APP_PASSWORD (voir apps/api/.env).
# - Pour un serveur partagé, changez POSTGRES_PASSWORD (variable d'environnement ou fichier .env à la racine).

x-database-url: &database-url postgresql://cartographie:${POSTGRES_PASSWORD:-cartographie}@postgres:5432/cartographie

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cartographie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cartographie}
      POSTGRES_DB: cartographie
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartographie -d cartographie"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "true"
      # Dans le conteneur, l'API écoute sur toutes ses interfaces pour que nginx la joigne ;
      # elle n'est pas publiée sur l'hôte. Elle refuse de démarrer sans APP_PASSWORD.
      API_HOST: 0.0.0.0
      WEB_ORIGIN: http://localhost:8080
      # nginx transmet l'adresse du visiteur : la limite d'essais de connexion s'applique par personne.
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - exports:/app/apps/api/data/exports
    restart: unless-stopped

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "exec", "tsx", "src/worker.ts"]
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - exports:/app/apps/api/data/exports
    restart: unless-stopped

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  exports:
