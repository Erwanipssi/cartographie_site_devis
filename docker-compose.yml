services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cartographie
      POSTGRES_PASSWORD: cartographie
      POSTGRES_DB: cartographie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartographie -d cartographie"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://cartographie:cartographie@postgres:5432/cartographie
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "true"
      API_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - exports:/app/apps/api/data/exports

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "exec", "tsx", "src/worker.ts"]
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://cartographie:cartographie@postgres:5432/cartographie
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - exports:/app/apps/api/data/exports

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  exports:
