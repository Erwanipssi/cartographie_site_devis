server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;

  # En-têtes de sécurité (repris dans chaque location : nginx n'hérite pas des add_header s'il en redéfinit).
  # CSP : scripts et données uniquement depuis l'application ; polices Google pour l'interface.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # L'API lit l'adresse réelle du visiteur (limite des essais de connexion) et sait si la connexion est chiffrée.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location / {
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri $uri/ /index.html;
  }
}
